{{/*
ONE ConfigMap PER FILE IN `config/`, named after the file and carrying it whole.

  chart/config/shared.yaml   ->  ConfigMap `shared`,   key `shared.yaml`
  chart/config/audit.yaml    ->  ConfigMap `audit`,    key `audit.yaml`

and so on. A service mounts the ConfigMaps it reads as DIRECTORIES, so
`shared.yaml` arrives at `/etc/yadgar/config/shared/shared.yaml` — which is the
path `yadgar-lifecycle` names when a knob is missing, and the same file name the
operator edits here.

NOTHING ENUMERATES THE SERVICES. The glob is the list, so adding a service is
adding a file. A `range` over a hard-coded list here would be the central list
D54 exists to delete, one repository over.

EACH DOCUMENT IS RENDERED FROM A DEEP MERGE of the file on disk under this
installation's own `.Values.<stem>` (ADR-0721). An adopter clones nothing and
changes any knob from their own repository in one line; `chart/values.schema.json`
declares which knobs exist and refuses every other key by name.

THE MERGE IS PER DOCUMENT, and that split is the ruling rather than an
optimisation:

  - A document with NO override is copied VERBATIM with `.Files.Get`, so its
    comments still reach the cluster and `kubectl -n yadgar get cm shared -o yaml`
    still shows the reasoning beside the number.
  - A document WITH an override is re-emitted from the merged data through
    `toYaml`, and LOSES its comments. That is a real loss, accepted deliberately:
    the reasoning still lives in the pinned chart version the adopter can render.

So with no values supplied there is nothing to merge and the render is
byte-identical to the copy-only form this chart shipped up to 0.1.4 — asserted
against a pinned sha256 by
`test_required_knob.py::test_declaring_nothing_renders_the_baseline_byte_for_byte`,
and per document by `test_values_merge.py`.

WHY NOT BYTE-FOR-BYTE ALWAYS, WHICH IS WHAT THIS FILE USED TO SAY. That property
was justified by "the file an operator edits is the file a process reads" — and
ADR-0705 dissolved the premise: under it the operator does NOT edit
`chart/config/`, they edit their own values file in their own repository. Keeping
the constraint after its justification was gone is what forced ADR-0720's
append-only mechanism, which could introduce a knob absent from the chart and
could never override one that was present. An adopter could clone nothing and
change nothing, which is ADR-0705's own rejected alternative.

A `{{` INSIDE ONE OF THOSE DOCUMENTS IS STILL DATA rather than a template, on both
paths: `.Files.Get` hands back bytes and `fromYaml` parses them. Nothing in
`config/` is ever templated.

MAPS RANGE IN KEY ORDER in Go templates, so the rendered output is stable and a
`helm template` diff shows only what actually changed. A merged document is
re-emitted by `toYaml`, which sorts its keys — so an overridden document's key
order is alphabetical rather than the order the file had.

CONSEQUENTIAL KNOBS ARE THE ONE KNOB CLASS WITH NO DEFAULT, AND
`chart/consequential.yaml` LISTS THEM. That list is empty today, so every branch
that reads it is inert. A knob named there is absent from `config/`, it comes from
the adopter's own values file, and nothing renders until they state it — ADR-0705's
"the refusal moves from boot to sync", raised by `required` naming the knob and the
file.
*/}}
{{- /*
THE DECLARATION LIST, read once. `default dict` covers both an absent file and a
comments-only one, and absence means NOTHING IS DECLARED — which is the same
posture as the empty `{}` the file ships with, rather than a failure that would
make deleting the file a way to turn the gate off quietly.
`scripts/one_source_per_knob.py` is what refuses the list and the schema
disagreeing, in either direction.
*/}}
{{- $files := .Files.Glob "config/*.yaml" }}
{{- $declared := (.Files.Get "consequential.yaml" | fromYaml) | default dict }}
{{- /*
A DECLARED STEM WITH NO DOCUMENT RENDERS NOTHING. The adopter would state the
value, the schema would accept it, and no ConfigMap would carry it — the silent
no-op this chart's schema was closed to delete. Caught here because the loop
below is driven by the files rather than by the list, so it could not notice.

THE STEM SET IS BUILT BY RANGING rather than asked of the glob directly:
`.Files.Glob` hands back helm's own `engine.files`, not a `map[string]interface{}`,
so `hasKey` on it fails the render with a type error rather than answering.
`range` over it works, which is what the loop below has always relied on.
*/}}
{{- $stems := dict }}
{{- range $path, $_ := $files }}
{{-   $stems = set $stems (trimSuffix ".yaml" (base $path)) true }}
{{- end }}
{{- range $stem, $_ := $declared }}
{{-   if not (hasKey $stems $stem) }}
{{-     fail (printf "chart/consequential.yaml declares knobs for `%s`, but chart/config/%s.yaml does not exist. Nothing would render the value an adopter set." $stem $stem) }}
{{-   end }}
{{- end }}
{{- range $path, $_ := $files }}
{{- $file := base $path }}
{{- $stem := trimSuffix ".yaml" $file }}
{{- $body := $.Files.Get $path }}
{{- $knobs := (index $declared $stem) | default list }}
{{- /*
THIS INSTALLATION'S OWN OVERRIDES FOR THIS DOCUMENT, and an EMPTY one is the
whole of the verbatim path below. `index` on a map answers nil for an absent key,
and `default dict` makes that the same thing as "nothing stated here" — so an
adopter who overrides `shared` leaves the other document untouched.
*/}}
{{- $supplied := (index $.Values $stem) | default dict }}
{{- if and $supplied (not (kindIs "map" $supplied)) }}
{{-   fail (printf "`%s` in your values file must be a MAPPING of this document's knobs, and it is a %s. The outermost key is the config file's stem and the rest is the knob's own path — see chart/config/%s." $stem (kindOf $supplied) $file) }}
{{- end }}
{{- if or $knobs $supplied }}
{{- /*
THE PARSE, needed by both the refusal below and the merge, and done ONLY on a
document that needs it — a document nobody overrides is never parsed and its bytes
are handed on untouched.

`fromYaml` DOES NOT FAIL ON MALFORMED INPUT: helm hands back a single-key map
holding `Error`, so a document this chart could not parse would otherwise be
re-emitted as `Error: ...` — the whole ConfigMap replaced by a message, rendering
cleanly. `check-yaml` runs over `chart/config/` on every commit here and this does
not rely on it.
*/}}
{{-   $parsed := (fromYaml $body) | default dict }}
{{-   if and (hasKey $parsed "Error") (eq (len $parsed) 1) }}
{{-     fail (printf "chart/config/%s is not a YAML document this chart can parse: %s. It cannot be merged with the values this installation supplied for `%s`." $file (index $parsed "Error") $stem) }}
{{-   end }}
{{-   range $knob := $knobs }}
{{- /*
RULE 1 FIRST, before anything asks for a value. A knob declared consequential is
ABSENT from `config/` — ADR-0705 amends ADR-0569 on the ORIGIN of a value only.
This runs even with no values file at all, so a repository-internal fault is
reported as itself rather than as a missing adopter value.

THE CHECK IS ON THE WHOLE KNOB PATH, which is what the merge buys. ADR-0720's
append could only partition by TOP-LEVEL key — it wrote a top-level mapping into
the copied document, so a key that document already had emitted a duplicate
mapping key and `tlsRotation.pollSeconds` could not be lifted out while
`splayMaxSeconds` stayed behind. A deep merge has no such restriction: two knobs
under one parent may be classified differently, and only the leaf itself may not
live in both sources at once.
*/}}
{{-     $segments := splitList "." $knob }}
{{-     $default := $parsed }}
{{-     $defaulted := true }}
{{-     range $segment := $segments }}
{{-       if and $defaulted (kindIs "map" $default) (hasKey $default $segment) }}
{{-         $default = index $default $segment }}
{{-       else }}
{{-         $defaulted = false }}
{{-       end }}
{{-     end }}
{{-     if $defaulted }}
{{-       fail (printf "`%s` is declared consequential in chart/consequential.yaml, so it carries no default — but chart/config/%s already defines it. A knob has one source (ADR-0569, upheld by ADR-0705): delete the `%s` line from chart/config/%s, or delete the declaration." $knob $file $knob $file) }}
{{-     end }}
{{- /*
THE WALK, and `hasKey` at every step rather than `dig`. `dig` cannot take a
run-time list of keys, and a plain `index` down a path returns nil for "absent"
and nil for "present and null" alike — the first is a refusal naming the knob, the
second is caught by `required` below. Separating them is what lets the message
name the knob and the file, which is the message ADR-0705 asks for in those words.
*/}}
{{-     $node := $supplied }}
{{-     $found := true }}
{{-     range $segment := $segments }}
{{-       if and $found (kindIs "map" $node) (hasKey $node $segment) }}
{{-         $node = index $node $segment }}
{{-       else }}
{{-         $found = false }}
{{-       end }}
{{-     end }}
{{-     $message := printf "`%s` carries no default and must be set in your own values file, under `%s.%s`. It belongs in chart/config/%s, and this chart will not render until you state it (ADR-0705)." $knob $stem $knob $file }}
{{-     if not $found }}
{{-       fail $message }}
{{-     end }}
{{- /*
`required` ON TOP OF THE WALK, because `hasKey` is true for a key present with no
value. `bucketName:` with nothing after it would otherwise merge
`bucketName: null` into the document — a value nobody chose, which is the class
ADR-0569 exists to delete rather than a shape to tolerate. `values.schema.json`
usually refuses it first; usually is not a guarantee, and this does not depend on
the schema being tight.
*/}}
{{-     $leaf := required $message $node }}
{{-   end }}
{{- end }}
{{- if $supplied }}
{{- /*
THE MERGE, and the newline `toYaml` does not return. Every document in `config/`
ends with exactly one (`end-of-file-fixer` runs on every commit), so the printf
makes the merged body end the same way the copied body does.

THE MOUNTED FILE DOES NOT DEPEND ON THAT, measured rather than assumed: the block
scalar below is `|`, and YAML's clip chomping ends the value with exactly one
newline whether the body carried none, one or two. So this is about the emitted
manifest reading like the copied form in a diff, and nothing a reader opens changes
if it is got wrong — which is why there is no test pinning it. The test that WOULD
have pinned it passed under both mutations, and a case that cannot fail is worse
than no case.
*/}}
{{-   $parsed := (fromYaml $body) | default dict }}
{{-   $body = printf "%s\n" (include "config.deepMerge" (dict "base" $parsed "over" $supplied)) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  # THE FILE NAME IS THE CONFIGMAP NAME, so `kubectl -n yadgar get cm audit`
  # answers "what is audit configured with" without anybody having to know a
  # naming scheme.
  #
  # NO PREFIX AND NO RELEASE NAME. A prefix would have to be hard-coded into
  # every consuming chart's volume, which puts this repository's release name
  # inside every other repository that mounts one of these. Checked before
  # choosing it: no OTHER chart in the estate renders a ConfigMap named `shared`
  # or `audit` today — `gateway` renders its own `gateway-knobs` (ADR-0740),
  # deliberately named to stay clear of this repository's names rather than
  # reusing one — so there is nothing to collide with. That is a fact about
  # today rather than a guarantee — a module chart that later renders a
  # ConfigMap named `shared` or `audit` WOULD collide, and two Argo Applications
  # owning one object is a fight neither wins. The README records these names
  # as reserved.
  name: {{ trimSuffix ".yaml" $file }}
  labels:
    app.kubernetes.io/name: {{ trimSuffix ".yaml" $file }}
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: yadgar
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  # THE INDENT IS THE ONLY THING THE TEMPLATE ADDS. A block scalar needs one, and
  # `indent` puts four spaces on EVERY line including the blank ones — which would
  # write trailing whitespace into the mounted file and make it differ from the
  # file in this repository for no reason anybody could see. The regex takes those
  # back off, so what a process reads is what an operator wrote, plus an indent.
{{- /*
THIS COMMENT IS RENDERED INTO THE CONFIGMAP, so the line above is deliberately
UNCHANGED — including the day the sentence stopped being true of every document.
It is still true of every document NOBODY OVERRIDES, which is both with no
values supplied; rewording it would change the rendered bytes of both for no
operator-visible gain, and the byte-identity gate exists to catch exactly that.
The qualifier an overridden document needs is emitted below, for that document
only, so the day an installation sets a knob the rendered MANIFEST says so and every
other document is untouched.

THAT QUALIFIER DOES NOT REACH THE CLUSTER, and neither does the paragraph above it.
Both sit in the `data:` MAPPING, above the `<file>.yaml:` key, so they are part of
the manifest and not part of the value — `kubectl get cm shared -o yaml` shows
neither. What reaches the cluster is the block scalar below, which is why a
document's OWN comments survive a copy and vanish under a merge. So this is written
for whoever reads `helm template` or Argo's manifest view, and the README rather than
the ConfigMap is where an operator learns what an override costs.
*/}}
{{- if $supplied }}
  #
  # EXCEPT IN THIS DOCUMENT, WHICH THIS INSTALLATION OVERRIDES. It is rendered
  # from a DEEP MERGE of the chart's own `config/{{ $file }}` under this
  # installation's `.Values.{{ $stem }}` (ADR-0721), so the keys below are sorted
  # rather than in the order the file had, and the reasoning written beside each
  # number in the chart is NOT here. Read it in the chart version you pinned:
  # `helm show chart` names the version, and the file is `config/{{ $file }}`.
{{- end }}
{{- if $knobs }}
  #
  # AND THE CONSEQUENTIAL KNOBS CAME FROM THIS INSTALLATION'S OWN VALUES FILE
  # rather than from `chart/config/`. They carry no default anywhere: ADR-0705
  # rule 2, and `chart/consequential.yaml` upstream is the list that says which
  # knobs those are.
{{- end }}
  {{ $file }}: |
{{ regexReplaceAll "(?m)[ \t]+$" (indent 4 $body) "" }}
{{- end }}
