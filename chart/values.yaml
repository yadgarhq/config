# THE DEFAULTS ARE NOT IN THIS FILE, AND THIS FILE MUST STAY EMPTY. They are in
# `chart/config/`, one document per service plus `shared.yaml`, and each of those
# files is the DEFAULT this chart ships for the knobs in it.
#
# WHAT AN ADOPTER SETS IS THEIR OWN VALUES FILE, in their own repository, and it
# needs nothing from here. `chart/templates/configmap.yaml` renders each ConfigMap
# from a DEEP MERGE of `config/<stem>.yaml` under `.Values.<stem>`, so
#
#   shared:
#     tlsRotation:
#       pollSeconds: 30
#
# in their values file changes that one number and inherits the rest of the
# document (ADR-0721). `chart/values.schema.json` says which knobs exist, gives
# each a type, and REFUSES every other key by name. `example/values.yaml` is the
# shape to copy.
#
# A KNOB WRITTEN HERE WOULD BREAK TWO THINGS AT ONCE, which is why this is a rule
# rather than a preference:
#
#   - IT WOULD BE A SECOND SOURCE for a value `chart/config/` already carries, and
#     ADR-0569 gives a knob exactly one source. `scripts/one_source_per_knob.py`
#     enforces the partition across the sources that exist; this file is not one of
#     them.
#   - IT WOULD OVERRIDE EVERY DOCUMENT IT NAMED, for every installation. A stem
#     present in `.Values` is what makes the chart re-emit that document from merged
#     data instead of copying its bytes — so a default here would take the comments
#     off a document nobody overrode, for everybody, and the byte-identity gate
#     would fail on a change nobody made.
#     `test_values_merge.py::test_chart_values_yaml_carries_no_default` is that
#     tripwire.
#
# So this file stays `{}`. If you are looking for `pollSeconds`, it is in
# `chart/config/shared.yaml`, and `helm template` is what shows you the value you
# inherit — `helm show values` prints this file, which says nothing on purpose.
{}
