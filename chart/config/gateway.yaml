# gateway.yaml — settings read only by `gateway`.
#
# **NO KNOB LIVES HERE YET.** The file exists so that the first one has an
# obvious home, and so that `gateway` mounts the same two ConfigMaps every other
# service does — its own and `shared`. An empty file renders an empty ConfigMap,
# which is a mount that works rather than a volume that fails.
#
# WHAT BELONGS HERE: a value only `gateway` reads. Its rate-limit buckets, its
# trusted-proxy hop count, its upstream timeouts — each of those is a gateway
# setting and none of them is a setting for `iam`.
#
# WHAT DOES NOT: anything every service reads with the same value. That goes in
# `shared.yaml`. A key path may appear in exactly one file in this directory and
# `scripts/one_source_per_knob.py` enforces it — there is no merge and no
# precedence, because a value assembled from two files is a value nobody wrote.
