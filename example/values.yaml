# THE VALUES FILE AN ORGANISATION COMMITS BESIDE `application.yaml`, in its OWN
# GitOps repository. Copy it there and point the Application at it.
#
# COPYING IT AS IT STANDS CHANGES NOTHING, and that is measured rather than claimed:
# this file is `{}` and `helm template ci-render chart -f example/values.yaml` renders
# byte-for-byte what the chart renders with no values at all.
# `test_required_knob.py::test_the_example_values_file_changes_nothing` asserts that
# against a pinned sha256, so the sentence above cannot quietly stop being true.
#
# ─── what you may set here ───────────────────────────────────────────────────
#
# EVERY KNOB THIS CHART DEFINES, and nothing else. The outermost key is the config
# file's stem and the rest is the knob's own path:
#
#   shared:
#     tlsRotation:
#       pollSeconds: 30
#
#   audit:
#     audit:
#       retentionDays: 30
#
# The ConfigMap is rendered from a DEEP MERGE of the chart's own document under what
# you state (ADR-0721), so the line above changes `pollSeconds` and leaves
# `splayMaxSeconds` at the chart's own 300 — including a value upstream improves in a
# later version. You clone nothing and you fork nothing.
#
# `helm show values` DOES NOT ANSWER "WHAT DO I INHERIT" — it prints the chart's own
# `values.yaml`, which is `{}` by design. Render the version you pinned instead:
#
#   helm template config oci://ghcr.io/yadgarhq/charts/config --version 0.1.5
#
# ─── what happens if you set anything else ───────────────────────────────────
#
# IT IS REFUSED BY NAME. `chart/values.schema.json` is closed
# (`additionalProperties: false`) at EVERY level, so `helm template` and
# `helm lint --strict` exit 1 and so does your Argo sync. That includes a TYPO IN A
# REAL KNOB: `pollSecond` is refused rather than merged in beside `pollSeconds`,
# where both would look set and one would be read.
#
# THAT REFUSAL IS THE FEATURE, and two earlier versions got it wrong in opposite
# directions. Up to chart 0.1.1 a values file you passed was silently DROPPED:
# byte-identical output, exit 0, no warning, and nothing anywhere saying your number
# had no effect. From 0.1.2 to 0.1.4 it was refused in FULL, which sounds stricter and
# is worse — you could change nothing at all without forking the chart. From 0.1.5 the
# knobs are declared, typed, and everything else is still refused.
#
# ─── what an override costs you ──────────────────────────────────────────────
#
# THE COMMENTS IN THE DOCUMENT YOU OVERRIDE, and only that document. A document you
# do not touch reaches your cluster byte for byte, so `kubectl -n yadgar get cm audit
# -o yaml` still shows the reasoning beside each number. A document you DO override is
# re-emitted from the merged data, so it carries the values without the argument for
# them, and its keys are sorted rather than in the chart's order. The argument is in
# the chart version you pinned; render it.
#
# ─── a knob with NO default ──────────────────────────────────────────────────
#
# A knob whose wrong value carries real consequence carries no default anywhere
# (ADR-0705 rule 2). Upstream names it in `chart/consequential.yaml` — WHICH IS EMPTY
# TODAY — and then nothing renders until you state it. HOW YOU LEARN THAT HAPPENED:
# you bump `targetRevision` and the sync FAILS, naming the knob and the file. That is
# deliberate, and it is why the version is a line you edit rather than a range you
# track.
#
# ─── one trap, measured ──────────────────────────────────────────────────────
#
# HELM DOES NOT TELL YOU A VALUES FILE IS MALFORMED. It reads what it can and
# renders: measured on helm 3.18.4 and 4.2.3, a file this very comment block
# followed by a stray top-level key — which PyYAML rejects outright with a
# ParserError — rendered the chart's own defaults and exited 0, silently.
#
# So if a knob you believe you set has no effect, PARSE YOUR FILE before you doubt
# the chart:
#
#   python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' values.yaml
#
# This repository's own `check-yaml` pre-commit hook covers the files here. Nothing
# upstream can cover yours, which is why it is written down rather than assumed.
{}
